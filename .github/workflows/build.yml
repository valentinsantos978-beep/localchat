name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            openjdk-17-jdk zip unzip cmake ninja-build \
            libffi-dev libssl-dev libjpeg-dev zlib1g-dev \
            libncurses5-dev libncursesw5-dev libsqlite3-dev \
            build-essential autoconf automake libtool pkg-config ccache wget

      - name: Cache llama.cpp build
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            llama.cpp
            android-ndk-r25b
          key: llama-b4667-v2
          restore-keys: llama-

      - name: Build llama-server (Android arm64 static)
        id: llama
        continue-on-error: true
        run: |
          set -e
          NDK_VERSION=r25b
          NDK_DIR=$PWD/android-ndk-$NDK_VERSION
          if [ ! -d "$NDK_DIR" ]; then
            echo "Baixando NDK $NDK_VERSION..."
            wget -q https://dl.google.com/android/repository/android-ndk-$NDK_VERSION-linux.zip
            unzip -q android-ndk-$NDK_VERSION-linux.zip
            rm android-ndk-$NDK_VERSION-linux.zip
          fi
          LLAMA_TAG=b4667
          if [ ! -d llama.cpp ]; then
            echo "Clonando llama.cpp tag $LLAMA_TAG..."
            git clone --depth 1 --branch $LLAMA_TAG https://github.com/ggerganov/llama.cpp
          fi
          cd llama.cpp
          echo "===== Configurando cmake ====="
          cmake -B build-android \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_DIR/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_NATIVE=OFF \
            -DLLAMA_CURL=OFF
          echo "===== Compilando target llama-server ====="
          cmake --build build-android --target llama-server -j$(nproc)
          mkdir -p ../bin
          cp build-android/bin/llama-server ../bin/llama-server
          chmod +x ../bin/llama-server
          echo "OK: bin/llama-server gerado ($(stat -c%s ../bin/llama-server) bytes)"

      - name: Prepare buildozer.spec (fallback se llama falhou)
        run: |
          if [ ! -f bin/llama-server ]; then
            echo "::warning::llama-server nao foi compilado. O APK sera gerado SEM IA local (so shell/Termux)."
            sed -i '/^android.add_assets/d' buildozer.spec
          else
            echo "OK: bin/llama-server presente, IA local sera incluida no APK."
          fi

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
            ~/.cache/pip
          key: bz-${ hashFiles('buildozer.spec') }-v3
          restore-keys: bz-

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Build APK
        run: |
          buildozer -v android debug 2>&1 | tee build.log

      - name: Verificar APK gerado
        run: |
          echo "===== Conteudo de bin/ ====="
          ls -la bin/ || echo "(bin/ nao existe)"
          if ls bin/*.apk >/dev/null 2>&1; then
            echo "OK: APK gerado"
          else
            echo "::error::Nenhum APK foi gerado em bin/. Veja o artifact build-log."
            exit 1
          fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localchat-apk
          path: bin/*.apk
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
