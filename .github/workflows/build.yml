name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            openjdk-17-jdk zip unzip cmake ninja-build \
            libffi-dev libssl-dev libjpeg-dev zlib1g-dev \
            libncurses5-dev libncursesw5-dev libsqlite3-dev \
            build-essential autoconf automake libtool pkg-config ccache wget

      - name: Cache llama.cpp build
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            llama.cpp/build-android
          key: llama-${ hashFiles('buildozer.spec') }-v1
          restore-keys: llama-

      - name: Build llama-server (Android arm64 static)
        run: |
          set -e
          NDK_VERSION=r25b
          NDK_ZIP=android-ndk-$NDK_VERSION-linux.zip
          NDK_DIR=$PWD/android-ndk-$NDK_VERSION
          if [ ! -d "$NDK_DIR" ]; then
            wget -q https://dl.google.com/android/repository/$NDK_ZIP
            unzip -q $NDK_ZIP
            rm $NDK_ZIP
          fi
          LLAMA_TAG=b4200
          if [ ! -d llama.cpp ]; then
            git clone --depth 1 --branch $LLAMA_TAG https://github.com/ggerganov/llama.cpp
          fi
          cd llama.cpp
          cmake -B build-android \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_DIR/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DLLAMA_CURL=OFF
          cmake --build build-android --target llama-server -j$(nproc)
          mkdir -p ../bin
          cp build-android/bin/llama-server ../bin/llama-server
          chmod +x ../bin/llama-server
          ls -la ../bin/

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
            ~/.cache/pip
          key: bz-${ hashFiles('buildozer.spec') }-v1
          restore-keys: bz-

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Build APK
        run: |
          buildozer -v android debug 2>&1 | tee build.log

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localchat-apk
          path: bin/*.apk
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
